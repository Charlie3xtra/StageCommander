name: stage_commander
description: "StageCommander - Cross-platform Material Design 3 live stage audio cue & show controller."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  flutter_soloud: ^5.3.0
  file_picker: ^13.3.3
  path_provider: ^2.1.6
  path: ^1.9.1
  desktop_drop: ^0.8.0
  archive: ^4.0.7
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
